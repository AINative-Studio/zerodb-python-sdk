[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerodb-mcp"
version = "1.3.0"
description = "Python client for ZeroDB: vector database, agent memory, and x402 agent payments (USDC micropayments) for AI agents and MCP servers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AINative Studio", email = "support@ainative.studio"}
]
keywords = [
    "zerodb", "mcp", "model-context-protocol", "vector", "vector-database",
    "database", "quantum", "ai",
    "ai-agents", "ai-agent", "agentic-ai", "autonomous-agents",
    "x402", "agent-payments", "agentic-commerce", "usdc", "micropayments", "http-402",
    "vibe-coding", "ai-coding", "ai-assistant",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Front-Ends",
]

dependencies = [
    "httpx>=0.24.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://ainative.studio"
Documentation = "https://docs.ainative.studio/sdk/python"
Repository = "https://github.com/AINative-Studio/zerodb-python-sdk"
Issues = "https://github.com/AINative-Studio/zerodb-python-sdk/issues"

[project.entry-points.pytest11]
zerodb_mcp = "zerodb_mcp.testing"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=zerodb_mcp --cov-report=html --cov-report=term-missing"
